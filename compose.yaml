services:
  api:
    image: taskspace:local
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:8080"
    environment:
      Cors__AllowedOrigin: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - taskspace-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "TaskSpace.Api.dll", "--healthcheck"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12

volumes:
  taskspace-data:
