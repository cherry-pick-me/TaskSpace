name: TaskSpace build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Record checked version
        run: |
          mkdir -p TestResults
          echo "checked_commit=$(git rev-parse HEAD)" > TestResults/commit.txt
      - name: Restore
        run: dotnet restore TaskSpace.slnx --locked-mode
      - name: Build
        run: dotnet build TaskSpace.slnx --configuration Release --no-restore
      - name: Test API
        run: >
          dotnet test TaskSpace.slnx --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=taskspace.trx" --results-directory TestResults
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Test web
        run: npm --prefix web test -- --reporter=default --reporter=junit --outputFile=../TestResults/web.xml
      - name: Build web
        run: npm --prefix web run build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 30
